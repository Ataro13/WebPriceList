    - generic [ref=e93]:
      - heading "FormSubmit Advanced Features" [level=1] [ref=e94]
      - paragraph [ref=e95]: Form inputs can have specially named name-attributes, which alter functionality. They are all prefixed with an underscore.
      - generic [ref=e96]:
        - heading "_replyto" [level=4] [ref=e97]:
          - mark [ref=e98]: _replyto
        - paragraph [ref=e99]: This value is used for the email's Reply-To field. This way you can directly "Reply" to the email to respond to the person who originally submitted the form.
        - paragraph [ref=e100]: To activate this feature your form should request the user's email address.
        - paragraph [ref=e101]: <input type="email" name="email" placeholder="Email Address">
        - heading "_next" [level=4] [ref=e102]:
          - mark [ref=e103]: _next
        - paragraph [ref=e104]: By default, after submitting a form the user is shown the FormSubmit "Thank You" page. You can provide an alternative URL for "Thank You" page.
        - paragraph [ref=e105]: <input type="hidden" name="_next" value="https://yourdomain.co/thanks.html">
        - heading "_subject" [level=4] [ref=e106]:
          - mark [ref=e107]: _subject
        - paragraph [ref=e108]: This value is used for the email's subject, so that you can quickly reply to submissions without having to edit the subject line each time.
        - paragraph [ref=e109]: <input type="hidden" name="_subject" value="New submission!">
        - heading "_cc" [level=4] [ref=e110]:
          - mark [ref=e111]: _cc
        - paragraph [ref=e112]: This value is used for the email's CC Field. This lets you send a copy of each submission to another email address.
        - paragraph [ref=e113]: <input type="hidden" name="_cc" value="another@email.com">
        - paragraph [ref=e114]: If you want to CC multiple email addresses, then just make it a list of email addresses separate by commas.
        - paragraph [ref=e115]: <input type="hidden" name="_cc" value="another@email.com,yetanother@email.com">
        - heading "_blacklist" [level=4] [ref=e116]:
          - mark [ref=e117]: _blacklist
        - paragraph [ref=e118]: Add this "blacklist" field along with a list of comma-separated phrases to filter out spam content from your submissions. Hence submissions that are containing given phrases will be completely disregarded while fooling spammers.
        - paragraph [ref=e119]: <input type="hidden" name="_blacklist" value="spammy pattern, banned term, phrase">
        - paragraph [ref=e120]: "* We recommend a maximum of 20 phrases as more can slow down the submission process."
        - heading "Disable reCAPTCHA _captcha" [level=4] [ref=e121]:
          - text: Disable reCAPTCHA
          - mark [ref=e122]: _captcha
        - paragraph [ref=e123]: Don't want your users to complete a reCAPTCHA? Each form now comes with the option to disable the reCAPTCHA, so you can maintain complete control over your form. You can even keep reCAPTCHA on a few forms that might be suceptible to spam, while disabling it on others.
        - paragraph [ref=e124]: <input type="hidden" name="_captcha" value="false">
        - paragraph [ref=e125]: "* We highly recommend you use the reCAPTCHA (not to disable it) in order to avoid some technical limitations which we impose from time to time in order to filter out bots, spam, and other malicious programs."
        - heading "_autoresponse" [level=4] [ref=e126]:
          - mark [ref=e127]: _autoresponse
        - paragraph [ref=e128]: You can send an instant response to your users with a copy of the submission. Add a custom message to the email body.
        - paragraph [ref=e129]: <input type="hidden" name="_autoresponse" value="your custom message">
        - paragraph [ref=e130]: To activate this feature your form should request the user's email address.
        - paragraph [ref=e131]: <input type="email" name="email" placeholder="Email Address">
        - paragraph [ref=e132]: "* autoresponse won't work with forms that are disabled reCAPTCHA and forms that are submitting through AJAX."
        - heading "_template" [level=4] [ref=e133]:
          - mark [ref=e134]: _template
        - paragraph [ref=e135]: You can select an email template from 3 different templates. By default, FormSubmit uses the basic template.
        - paragraph [ref=e136]: <input type="hidden" name="_template" value="table">
        - paragraph [ref=e137]:
          - link "View all templates here →" [ref=e138] [cursor=pointer]:
            - /url: /email-templates
        - heading "_webhook" [level=4] [ref=e139]:
          - mark [ref=e140]: _webhook
        - paragraph [ref=e141]: This feature allows you to configure a webhook that will be triggered each time a form receives a new submission. Webhooks can be used to manipulate data in real-time.
        - paragraph [ref=e142]: <input type="hidden" name="_webhook" value="https://yourdomain.co/your-webhook">
        - paragraph [ref=e143]: sample webhook response
        - paragraph [ref=e144]: "{ \"form_data\": { \"name\": \"Devro LABS\", \"email\": \"hello@devrolabs.com\", \"message\": \"hello! there\" } }"
        - heading "Read more from Documentation →" [level=4] [ref=e145]:
          - link "Read more from Documentation →" [ref=e146] [cursor=pointer]:
            - /url: /documentation
